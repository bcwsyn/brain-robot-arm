sensors:
  - astra_depth_pointcloud

astra_depth_pointcloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  # Only point clouds with complete same-timestamp robot TF are forwarded.
  # This prevents robot returns from being written into the Octomap when the
  # self-filter cannot resolve a collision-link transform.
  point_cloud_topic: /brain_robot_vision/tf_validated_points
  max_range: 2.0
  point_subsample: 2
  padding_offset: 0.03
  padding_scale: 1.0
  max_update_rate: 5.0
  filtered_cloud_topic: /brain_robot_vision/filtered_points
