# The physical wrist camera remains an RGB-D target sensor, but it is not a
# world-occupancy sensor.  Register no MoveIt 3D updater here: this prevents
# stale/self-returned wrist points from becoming Octomap obstacles.  The
# visual controller and active-scan supervisor still use their TF-gated cloud
# topic as a freshness signal, while robot self-collision checking remains
# enabled in the PlanningScene.
sensors: []

astra_depth_pointcloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  # The camera is mounted on the moving gripper.  Do not turn its own robot
  # returns into world obstacles: keep MoveIt's updater initialized but detach
  # the physical wrist cloud from the Octomap input.  The visual controller
  # separately monitors the TF-gated cloud as a freshness heartbeat.
  point_cloud_topic: /brain_robot_vision/disabled_octomap_points
  max_range: 2.0
  point_subsample: 2
  queue_size: 5
  # Match the vendor MoveIt self-filter envelope.  The physical depth stream
  # has enough calibration/noise error that a 1.0 scale leaves link2 returns
  # in the occupancy map even when the TF gate is valid.
  padding_offset: 0.03
  padding_scale: 4.0
  max_update_rate: 5.0
  filtered_cloud_topic: /brain_robot_vision/filtered_points
